<style>
html, body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:55px;
    background:#0f172a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:9999;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
}

.navbar h1{
    margin:0;
    font-size:18px;
    font-weight:600;
}

.navbar a{
    color:white;
    text-decoration:none;
    background:#2563eb;
    padding:8px 14px;
    border-radius:8px;
    font-size:14px;
}

.navbar a:hover{
    background:#1d4ed8;
}

/* MAP */
#map{
    position:absolute;
    top:55px;
    left:0;
    right:0;
    bottom:0;
}

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <style>
        html, body {
            background-color: #ffffff;

            background-color: #f8f8f8!important;

        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {

        }
        .ol-control > *:focus, .ol-control >*:hover {

        .ol-control {

<script src="resources/proj4.js"></script>
